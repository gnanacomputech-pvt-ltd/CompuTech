# HTTP-only, no domain — this instance is reached by IP for now. Serves the
# built React frontend directly and proxies API/admin/verify routes to
# Gunicorn. Swap in TLS + server_name once a domain is registered (see
# gcs_erp/docker/nginx/nginx.conf for the HTTPS/Certbot version).

upstream gcs_api {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location ~ ^/(api|admin|verify)/ {
        proxy_pass http://gcs_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }
}
