# Minimal single-instance deployment. Reuses the same backend Dockerfile as
# gcs_erp/docker/, but adds the built frontend + a plain-HTTP nginx config
# (see deploy-nginx/nginx.conf) instead of the HTTPS/Certbot one, since this
# instance has no domain yet.
services:
  db:
    image: postgres:16-alpine
    container_name: gcs_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gcs_erp_production}
      POSTGRES_USER: ${POSTGRES_USER:-gcs_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gcs_admin} -d ${POSTGRES_DB:-gcs_erp_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gcs_internal

  redis:
    image: redis:7-alpine
    container_name: gcs_erp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gcs_internal

  web:
    build:
      context: ./gcs_erp
      dockerfile: docker/Dockerfile
    container_name: gcs_erp_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gcs_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-gcs_erp_production}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - gcs_internal
      - gcs_web

  celery_worker:
    build:
      context: ./gcs_erp
      dockerfile: docker/Dockerfile
    container_name: gcs_erp_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info -c 2
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gcs_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-gcs_erp_production}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/app/media
    networks:
      - gcs_internal

  celery_beat:
    build:
      context: ./gcs_erp
      dockerfile: docker/Dockerfile
    container_name: gcs_erp_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gcs_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-gcs_erp_production}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - gcs_internal

  nginx:
    image: nginx:alpine
    container_name: gcs_erp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy-nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
      - ./frontend-dist:/var/www/frontend:ro
    depends_on:
      - web
    networks:
      - gcs_web

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  gcs_internal:
    internal: true
  gcs_web:
    driver: bridge
