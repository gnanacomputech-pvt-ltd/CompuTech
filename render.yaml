databases:
  - name: gcs-erp-redis
    ipAllowList: []     # only allow internal Render connections
    plan: free          # NOTE: free Redis is ephemeral (90-day inactivity deletion)

services:
  # --- Django REST API -------------------------------------------------------
  - type: web
    name: gcs-erp-api
    runtime: python
    plan: free          # upgrade for production (free sleeps after 15 min inactivity)
    rootDir: gcs_erp
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        value: "postgresql://postgres:REMOVED_SECRET@db.tpndrlirvmknywmfyukz.supabase.co:5432/postgres"
      - key: REDIS_URL
        fromService:
          type: redis
          name: gcs-erp-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: ""   # set to frontend URL after first deploy (e.g. https://gcs-erp-frontend.onrender.com)
      - key: FRONTEND_URL
        value: ""   # set to frontend URL after first deploy
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: MINIMUM_ATTENDANCE_PERCENTAGE
        value: "75.0"
      # Optional: Cloudflare R2 media storage
      # - key: R2_ACCESS_KEY_ID
      #   value: ""
      # - key: R2_SECRET_ACCESS_KEY
      #   value: ""
      # - key: R2_BUCKET_NAME
      #   value: ""
      # - key: R2_ENDPOINT_URL
      #   value: ""
      # Optional: Sentry error monitoring
      # - key: SENTRY_DSN
      #   value: ""

  # --- Celery Worker (Optional: Requires Render Starter plan) -----------------
  - type: worker
    name: gcs-erp-celery-worker
    runtime: python
    plan: starter       # background workers require Render starter plan ($7/mo)
    rootDir: gcs_erp
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker --loglevel=info --concurrency=2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        fromService:
          type: web
          name: gcs-erp-api
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: "postgresql://postgres:REMOVED_SECRET@db.tpndrlirvmknywmfyukz.supabase.co:5432/postgres"
      - key: REDIS_URL
        fromService:
          type: redis
          name: gcs-erp-redis
          property: connectionString

  # --- Celery Beat Scheduler (Optional: Requires Render Starter plan) ---------
  - type: worker
    name: gcs-erp-celery-beat
    runtime: python
    plan: starter       # background workers require Render starter plan ($7/mo)
    rootDir: gcs_erp
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat --loglevel=info"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        fromService:
          type: web
          name: gcs-erp-api
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: "postgresql://postgres:REMOVED_SECRET@db.tpndrlirvmknywmfyukz.supabase.co:5432/postgres"
      - key: REDIS_URL
        fromService:
          type: redis
          name: gcs-erp-redis
          property: connectionString

  # --- React / Vite Frontend (Static Site) -----------------------------------
  - type: web
    name: gcs-erp-frontend
    runtime: static
    rootDir: .
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-XSS-Protection
        value: "1; mode=block"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: ""   # set to https://gcs-erp-api.onrender.com after first deploy
