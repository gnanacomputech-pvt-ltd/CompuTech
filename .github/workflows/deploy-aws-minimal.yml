name: Deploy to AWS (minimal single-instance)

# Redeploys the app to the infra/aws-minimal EC2 instance — NOT the full
# HA architecture in infra/aws/ (see the other deploy-*.yml workflows for
# that). Direct SSH to the instance doesn't work from every network, so
# this uses the same path a human would: build → package → upload to S3
# → tell the instance via AWS Systems Manager to pull and rebuild.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'gcs_erp/**'
      - 'infra/aws-minimal/deploy-compose.yml'
      - 'infra/aws-minimal/deploy-nginx/**'
      - '.github/workflows/deploy-aws-minimal.yml'
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  DEPLOY_BUCKET: gcs-erp-deploy-312728688240
  INSTANCE_ID: i-00f0acccec3c821e0
  SERVER_IP: 13.232.187.23

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://${{ env.SERVER_IP }}

      - name: Assemble deployment bundle
        run: |
          mkdir -p app-bundle/gcs_erp
          tar -cf - \
            --exclude='venv' --exclude='__pycache__' --exclude='*.pyc' \
            --exclude='db.sqlite3' --exclude='.env' --exclude='staticfiles' \
            --exclude='media' --exclude='.pytest_cache' --exclude='.git' \
            -C gcs_erp . | tar -xf - -C app-bundle/gcs_erp
          cp infra/aws-minimal/deploy-compose.yml app-bundle/docker-compose.yml
          cp -r infra/aws-minimal/deploy-nginx app-bundle/deploy-nginx
          cp -r dist app-bundle/frontend-dist
          printf '%s' "${{ secrets.DEPLOY_ENV_FILE }}" > app-bundle/.env
          tar -czf app-bundle.tar.gz -C app-bundle .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload bundle to S3
        run: aws s3 cp app-bundle.tar.gz s3://${{ env.DEPLOY_BUCKET }}/app-bundle.tar.gz

      - name: Redeploy on the instance via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ env.INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["set -e","cd /opt/gcs-erp","docker compose down","aws s3 cp s3://${{ env.DEPLOY_BUCKET }}/app-bundle.tar.gz /tmp/app-bundle.tar.gz --region ${{ env.AWS_REGION }}","tar -xzf /tmp/app-bundle.tar.gz -C /opt/gcs-erp","rm /tmp/app-bundle.tar.gz","docker compose up -d --build"]' \
            --timeout-seconds 600 \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" --output text)
          echo "SSM command: $COMMAND_ID"

          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id ${{ env.INSTANCE_ID }} \
              --region ${{ env.AWS_REGION }} \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id ${{ env.INSTANCE_ID }} --region ${{ env.AWS_REGION }}
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for deployment to finish"
          exit 1
