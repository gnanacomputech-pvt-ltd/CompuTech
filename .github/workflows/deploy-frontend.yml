name: Deploy — Frontend (S3 + CloudFront)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

# S3_BUCKET / CLOUDFRONT_DISTRIBUTION_ID come from Terraform outputs
# (infra/aws: frontend_bucket_name, cloudfront_distribution_id) — set them
# as repo/environment secrets once `terraform apply` has run.
jobs:
  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Check AWS configuration
        id: check-aws
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          if [ -n "$AWS_ROLE_ARN" ] && [ -n "$S3_BUCKET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS deployment skipped: AWS_ROLE_ARN or S3_BUCKET secret is not configured in repository settings."
          fi

      - name: Configure AWS credentials
        if: steps.check-aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Sync build to S3
        if: steps.check-aws.outputs.configured == 'true'
        run: |
          # Hashed assets (JS/CSS/images) are safe to cache hard at the edge;
          # index.html is not — it's what picks up each new deploy.
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html "s3://${{ secrets.S3_BUCKET }}/index.html" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        if: steps.check-aws.outputs.configured == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
