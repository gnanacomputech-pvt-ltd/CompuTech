<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gnana Computech Solutions Private Limited | Tech Training, Projects & Software Solutions</title>
    <meta name="description" content="Gnana Computech Solutions Private Limited - Leading software development, BCA & MCA academic projects, degree student internships, IT training and placement support in Sunkadakatte, Bangalore." />
    
    <!-- Tailwind is compiled at build time via tailwind.config.js + postcss.config.js
         and imported through src/index.css. The Tailwind Play CDN must never be
         used here: it is a dev-only tool that ships a compiler to the browser,
         causes a flash of unstyled content, and makes the site depend on a
         third-party CDN being reachable. The <style> block below only covers the
         base paint before the CSS bundle loads. -->
    <style>
      *, *::before, *::after, html, body, button, input, select, textarea, h1, h2, h3, h4, h5, h6, p, span, a, div, li, ul, ol, label, td, th, code, pre, small, strong, b, em, i {
        font-family: Verdana, Geneva, Tahoma, sans-serif !important;
      }
      body {
        background-color: #FAFAF7;
        color: #252525;
        overflow-x: hidden;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #17181A;
      }
      ::-webkit-scrollbar-thumb {
        background: #D4A72C;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #B88918;
      }
    </style>
  </head>
  <body class="bg-[#FAFAF7] text-[#252525] antialiased selection:bg-[#D4A72C] selection:text-white min-h-screen flex flex-col">
    <div id="root"></div>

    <!-- Main Vite Script Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
